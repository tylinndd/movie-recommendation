# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: filmfanatic-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: FRONTEND_ORIGIN_REGEX
        value: ^https://[\w-]+\.vercel\.app$
      - key: DATABASE_URL
        fromDatabase:
          name: filmfanatic-db
          property: connectionString

databases:
  - name: filmfanatic-db
    plan: free
    databaseName: filmfanatic
    user: filmfanatic
